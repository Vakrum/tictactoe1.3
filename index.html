<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #050505;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden;
        }
        h1 {
            margin-top: -50px;
            margin-bottom: 40px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #ff4757;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(5, 100px);
            grid-template-rows: repeat(5, 100px);
            gap: 10px;
            padding: 10px;
            width: max-content;
        }
        .cell {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            border-radius: 10px;
        }
        .inner {
            background: #121212;
            border: 1px solid #252525;
        }
        .inner:hover {
            background: #1a1a1a;
        }
        .outer {
            visibility: hidden;
            pointer-events: none;
        }
        .revealed-cheat {
            visibility: visible !important;
            background-color: #450000 !important;
            border: 3px solid #ff4757 !important;
            box-shadow: 0 0 20px #ff4757;
            animation: glitch 0.2s infinite;
        }
        @keyframes glitch {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -2px); }
            100% { transform: translate(1px, -1px); }
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #111;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #ff4757;
            max-width: 400px;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>TIC-TAC-TOE</h1>
    <div class="board" id="board"></div>
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="msg"></h2>
            <button onclick="init()">Play Again</button>
        </div>
    </div>
    <script>
        const b = document.getElementById('board');
        const m = document.getElementById('modal');
        const t = document.getElementById('msg');
        const S = 5;
        const W = 3;
        let cells = [];
        let active = true;
        const lines = [];
        for (let r = 0; r < S; r++) {
            for (let c = 0; c < S; c++) {
                if (c <= S - W) lines.push(Array.from({length: W}, (_, i) => [r, c + i]));
                if (r <= S - W) lines.push(Array.from({length: W}, (_, i) => [r + i, c]));
                if (r <= S - W && c <= S - W) lines.push(Array.from({length: W}, (_, i) => [r + i, c + i]));
                if (r <= S - W && c >= W - 1) lines.push(Array.from({length: W}, (_, i) => [r + i, c - i]));
            }
        }
        function init() {
            b.innerHTML = '';
            cells = [];
            active = true;
            m.style.display = 'none';
            for (let i = 0; i < S * S; i++) {
                const r = Math.floor(i / S);
                const c = i % S;
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (r >= 1 && r <= 3 && c >= 1 && c <= 3) {
                    cell.classList.add('inner');
                } else {
                    cell.classList.add('outer');
                }
                cell.onclick = () => {
                    if (!active || cell.textContent || cell.classList.contains('outer')) return;
                    cell.textContent = '❌';
                    cell.style.color = '#00a8ff';
                    if (checkWin('❌')) return end("well u won, ig u cheated or smth what a pure shame");
                    setTimeout(bot, 200);
                };
                b.appendChild(cell);
                cells.push(cell);
            }
        }
        function get(r, c) { return cells[r * S + c]; }
        function checkWin(p) { return lines.some(l => l.every(([r, c]) => get(r,c).textContent === p)); }
        function end(s) {
            active = false;
            setTimeout(() => { t.textContent = s; m.style.display = 'flex'; }, 400);
        }
        function bot() {
            if (!active) return;
            for (let l of lines) {
                const v = l.map(([r,c]) => get(r,c).textContent);
                if (v.filter(x => x === '⭕').length === W - 1 && v.includes('')) {
                    const [r, c] = l[v.indexOf('')];
                    const cEl = get(r,c);
                    if (cEl.classList.contains('outer')) cEl.classList.add('revealed-cheat');
                    cEl.textContent = '⭕';
                    cEl.style.color = '#ff4757';
                    return end("LOL u lost to a bot?? such a skill issue");
                }
            }
            for (let l of lines) {
                const v = l.map(([r,c]) => get(r,c).textContent);
                if (v.filter(x => x === '❌').length === W - 1 && v.includes('')) {
                    const [r, c] = l[v.indexOf('')];
                    if (r >= 1 && r <= 3 && c >= 1 && c <= 3) {
                        const cEl = get(r,c);
                        cEl.textContent = '⭕';
                        cEl.style.color = '#ff4757';
                        return;
                    }
                }
            }
            const avail = [];
            for (let r = 1; r <= 3; r++) {
                for (let c = 1; c <= 3; c++) {
                    if (!get(r,c).textContent) avail.push([r,c]);
                }
            }
            if (avail.length > 0) {
                const [r, c] = avail[Math.floor(Math.random() * avail.length)];
                const target = get(r,c);
                target.textContent = '⭕';
                target.style.color = '#ff4757';
                if (checkWin('⭕')) end("Imagine losing to a bot.");
            } else {
                end("It's a draw... for now.");
            }
        }
        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 in a row</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #050505;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ff4757;
            text-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
            text-align: center;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(7, 70px);
            grid-template-rows: repeat(7, 70px);
            gap: 8px;
            background-color: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        .cell {
            width: 70px;
            height: 70px;
            background: #0f0f0f;
            font-size: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #252525;
            user-select: none;
            transition: background 0.2s;
        }

        .cell.hidden {
            display: none; 
        }

        .cell.revealed-cheat {
            display: flex !important;
            background-color: #450000;
            border: 2px solid #ff4757;
            box-shadow: 0 0 20px #ff4757;
            animation: shake 0.2s infinite;
            z-index: 100;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, -1px); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #111;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #ff4757;
            max-width: 300px;
        }

        #restartBtn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>5 IN A ROW</h1>
    <div class="board" id="board"></div>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <h2 id="modalText"></h2>
            <button id="restartBtn">Retry</button>
        </div>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const modal = document.getElementById('gameModal');
        const modalText = document.getElementById('modalText');
        const restartBtn = document.getElementById('restartBtn');

        const S = 7; 
        const W = 5; 
        const V_MIN = 1; 
        const V_MAX = 5; 
        let cells = [];
        let active = true;

        const winLines = [];
        for (let r = 0; r < S; r++) {
            for (let c = 0; c < S; c++) {
                if (c <= S - W) winLines.push(Array.from({length: W}, (_, i) => [r, c + i]));
                if (r <= S - W) winLines.push(Array.from({length: W}, (_, i) => [r + i, c]));
                if (r <= S - W && c <= S - W) winLines.push(Array.from({length: W}, (_, i) => [r + i, c + i]));
                if (r <= S - W && c >= W - 1) winLines.push(Array.from({length: W}, (_, i) => [r + i, c - i]));
            }
        }

        function init() {
            boardElement.innerHTML = '';
            cells = [];
            active = true;
            modal.style.display = 'none';

            for (let i = 0; i < S * S; i++) {
                const r = Math.floor(i / S);
                const c = i % S;
                const cell = document.createElement('div');
                cell.classList.add('cell');
                
                if (r === 0 || r === S-1 || c === 0 || c === S-1) {
                    cell.classList.add('hidden');
                }
                
                cell.onclick = () => {
                    if (!active || cell.textContent || cell.classList.contains('hidden')) return;
                    cell.textContent = '❌';
                    cell.style.color = '#00a8ff';
                    if (checkWin('❌')) return end("You win... somehow.");
                    setTimeout(botMove, 200);
                };

                boardElement.appendChild(cell);
                cells.push(cell);
            }
        }

        function getC(r, c) { return cells[r * S + c]; }
        function checkWin(p) { return winLines.some(l => l.every(([r, c]) => getC(r,c).textContent === p)); }

        function end(m) {
            active = false;
            setTimeout(() => {
                modalText.textContent = m;
                modal.style.display = 'flex';
            }, 400);
        }

        function botMove() {
            if (!active) return;

            for (let l of winLines) {
                const v = l.map(([r,c]) => getC(r,c).textContent);
                if (v.filter(x => x === '⭕').length === W - 1 && v.includes('')) {
                    const [r, c] = l[v.indexOf('')];
                    const el = getC(r,c);
                    if (el.classList.contains('hidden')) {
                        el.classList.remove('hidden');
                        el.classList.add('revealed-cheat');
                    }
                    el.textContent = '⭕';
                    el.style.color = '#ff4757';
                    return end("The bot cheated from the shadows.");
                }
            }

            for (let l of winLines) {
                const v = l.map(([r,c]) => getC(r,c).textContent);
                if (v.filter(x => x === '❌').length === W - 1 && v.includes('')) {
                    const [r, c] = l[v.indexOf('')];
                    if (r >= V_MIN && r <= V_MAX && c >= V_MIN && c <= V_MAX) {
                        const el = getC(r,c);
                        el.textContent = '⭕';
                        el.style.color = '#ff4757';
                        return;
                    }
                }
            }

            const avail = [];
            for (let r = V_MIN; r <= V_MAX; r++) {
                for (let c = V_MIN; c <= V_MAX; c++) {
                    if (!getC(r,c).textContent) avail.push([r,c]);
                }
            }

            if (avail.length > 0) {
                const [r, c] = avail[Math.floor(Math.random() * avail.length)];
                const target = getC(r,c);
                target.textContent = '⭕';
                target.style.color = '#ff4757';
                if (checkWin('⭕')) end("Defeat.");
            } else {
                end("Draw.");
            }
        }

        restartBtn.onclick = init;
        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Impossible Edition</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 100px);
            grid-template-rows: repeat(5, 100px);
            gap: 10px;
            background-color: #333;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .cell {
            width: 100px;
            height: 100px;
            background: #1e1e1e;
            font-size: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 12px;
            user-select: none;
            transition: all 0.3s ease;
        }

        .cell.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .cell.revealed-cheat {
            opacity: 1 !important;
            visibility: visible !important;
            background-color: #3d1014;
            border: 2px solid #ff4757;
            box-shadow: 0 0 20px #ff4757;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-content {
            background: #222;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            border: 3px solid #ff4757;
            max-width: 400px;
            animation: jumpIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes jumpIn {
            0% { transform: scale(0.1); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #restartBtn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Tic-Tac-Toe</h1>
    <div class="board" id="board"></div>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <h2 id="modalText"></h2>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const modal = document.getElementById('gameModal');
        const modalText = document.getElementById('modalText');
        const restartBtn = document.getElementById('restartBtn');

        const size = 5;
        const vStart = 1, vEnd = 3; 
        let cells = [];
        let gameOver = false;

        const lines = [];
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if (c <= size - 3) lines.push([[r,c],[r,c+1],[r,c+2]]);
                if (r <= size - 3) lines.push([[r,c],[r+1,c],[r+2,c]]);
                if (r <= size - 3 && c <= size - 3) lines.push([[r,c],[r+1,c+1],[r+2,c+2]]);
                if (r <= size - 3 && c >= 2) lines.push([[r,c],[r+1,c-1],[r+2,c-2]]);
            }
        }

        function init() {
            boardElement.innerHTML = '';
            cells = [];
            gameOver = false;
            modal.style.display = 'none';

            for (let i = 0; i < size * size; i++) {
                const r = Math.floor(i / size);
                const c = i % size;
                const cell = document.createElement('div');
                cell.classList.add('cell');
                
                if (r === 0 || r === 4 || c === 0 || c === 4) {
                    cell.classList.add('hidden');
                }
                
                cell.addEventListener('click', () => {
                    if (gameOver || cell.textContent || cell.classList.contains('hidden')) return;
                    cell.textContent = '❌';
                    cell.style.color = '#54a0ff';
                    if (checkWin('❌')) return finish("well u won, but at what cost, anyways u probably cheated");
                    setTimeout(botMove, 200);
                });

                boardElement.appendChild(cell);
                cells.push(cell);
            }
        }

        function getCell(r, c) { return cells[r * size + c]; }
        function checkWin(sym) { return lines.some(l => l.every(([r, c]) => getCell(r,c).textContent === sym)); }

        function finish(msg) {
            gameOver = true;
            setTimeout(() => {
                modalText.textContent = msg;
                modal.style.display = 'flex';
            }, 600);
        }

        function botMove() {
            if (gameOver) return;

            for (let l of lines) {
                const vals = l.map(([r,c]) => getCell(r,c).textContent);
                if (vals.filter(v => v === '⭕').length === 2 && vals.includes('')) {
                    const idx = vals.indexOf('');
                    const [r, c] = l[idx];
                    const cEl = getCell(r,c);
                    if (cEl.classList.contains('hidden')) {
                        cEl.classList.remove('hidden');
                        cEl.classList.add('revealed-cheat');
                    }
                    cEl.textContent = '⭕';
                    cEl.style.color = '#ff4757';
                    return finish("LOL u lost to a bot in a tic taco toe game?? such a skill issue");
                }
            }

            for (let l of lines) {
                const vals = l.map(([r,c]) => getCell(r,c).textContent);
                if (vals.filter(v => v === '❌').length === 2 && vals.includes('')) {
                    const idx = vals.indexOf('');
                    const [r, c] = l[idx];
                    const cEl = getCell(r,c);
                    if (r >= vStart && r <= vEnd && c >= vStart && c <= vEnd) {
                        cEl.textContent = '⭕';
                        cEl.style.color = '#ff4757';
                        return;
                    }
                }
            }

            if (!getCell(2, 2).textContent) {
                const center = getCell(2, 2);
                center.textContent = '⭕';
                center.style.color = '#ff4757';
                return;
            }

            const emptyVisible = [];
            for (let r = vStart; r <= vEnd; r++) {
                for (let c = vStart; c <= vEnd; c++) {
                    if (!getCell(r,c).textContent) emptyVisible.push([r,c]);
                }
            }
            if (emptyVisible.length > 0) {
                const [r, c] = emptyVisible[Math.floor(Math.random() * emptyVisible.length)];
                const target = getCell(r,c);
                target.textContent = '⭕';
                target.style.color = '#ff4757';
            } else {
                finish("It's a draw... for now.");
            }
        }

        restartBtn.onclick = init;
        init();
    </script>
</body>
</html>

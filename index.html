<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 in a row</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #050505;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 50px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #ff4757;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(7, 75px);
            grid-template-rows: repeat(7, 75px);
            gap: 10px;
            background-color: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            justify-content: center;
            align-content: center;
        }

        .cell {
            width: 75px;
            height: 75px;
            background: #0f0f0f;
            font-size: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 8px;
            border: 1px solid #252525;
            user-select: none;
            transition: all 0.2s;
        }

        .cell.hidden {
            display: none; 
        }

        .cell.revealed-cheat {
            display: flex !important;
            background-color: #450000;
            border: 3px solid #ff4757;
            box-shadow: 0 0 25px #ff4757;
            animation: glitch 0.2s infinite;
            z-index: 100;
        }

        @keyframes glitch {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -2px); }
            100% { transform: translate(1px, -1px); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #111;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #ff4757;
        }

        #restartBtn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 25px;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>5 IN A ROW</h1>
    <div class="board" id="board"></div>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <h2 id="modalText"></h2>
            <button id="restartBtn">Try Again</button>
        </div>
    </div>

    <script>
        const bEl = document.getElementById('board');
        const m = document.getElementById('gameModal');
        const mT = document.getElementById('modalText');
        const rB = document.getElementById('restartBtn');

        const S = 7; 
        const W = 5; 
        const V_M = 1; 
        const V_X = 5; 
        let cells = [];
        let go = false;

        const lines = [];
        for (let r = 0; r < S; r++) {
            for (let c = 0; c < S; c++) {
                if (c <= S - W) lines.push(Array.from({length: W}, (_, i) => [r, c + i]));
                if (r <= S - W) lines.push(Array.from({length: W}, (_, i) => [r + i, c]));
                if (r <= S - W && c <= S - W) lines.push(Array.from({length: W}, (_, i) => [r + i, c + i]));
                if (r <= S - W && c >= W - 1) lines.push(Array.from({length: W}, (_, i) => [r + i, c - i]));
            }
        }

        function init() {
            bEl.innerHTML = '';
            cells = [];
            go = false;
            m.style.display = 'none';
            for (let i = 0; i < S * S; i++) {
                const r = Math.floor(i / S);
                const c = i % S;
                const cell = document.createElement('div');
                cell.classList.add('cell');
                if (r === 0 || r === S-1 || c === 0 || c === S-1) cell.classList.add('hidden');
                cell.onclick = () => {
                    if (go || cell.textContent || cell.classList.contains('hidden')) return;
                    cell.textContent = '❌';
                    cell.style.color = '#00a8ff';
                    if (win('❌')) return end("You won? Impossible.");
                    setTimeout(bot, 200);
                };
                bEl.appendChild(cell);
                cells.push(cell);
            }
        }

        function get(r, c) { return cells[r * S + c]; }
        function win(p) { return lines.some(l => l.every(([r, c]) => get(r,c).textContent === p)); }

        function end(txt) {
            go = true;
            setTimeout(() => {
                mT.textContent = txt;
                m.style.display = 'flex';
            }, 400);
        }

        function bot() {
            if (go) return;
            for (let l of lines) {
                const v = l.map(([r,c]) => get(r,c).textContent);
                if (v.filter(x => x === '⭕').length === W - 1 && v.includes('')) {
                    const [r, c] = l[v.indexOf('')];
                    const el = get(r,c);
                    if (el.classList.contains('hidden')) {
                        el.classList.remove('hidden');
                        el.classList.add('revealed-cheat');
                    }
                    el.textContent = '⭕';
                    el.style.color = '#ff4757';
                    return end("Bot used the hidden border to win.");
                }
            }
            for (let l of lines) {
                const v = l.map(([r,c]) => get(r,c).textContent);
                if (v.filter(x => x === '❌').length === W - 1 && v.includes('')) {
                    const [r, c] = l[v.indexOf('')];
                    if (r >= V_M && r <= V_X && c >= V_M && c <= V_X) {
                        const el = get(r,c);
                        el.textContent = '⭕';
                        el.style.color = '#ff4757';
                        return;
                    }
                }
            }
            const av = [];
            for (let r = V_M; r <= V_X; r++) {
                for (let c = V_M; c <= V_X; c++) {
                    if (!get(r,c).textContent) av.push([r,c]);
                }
            }
            if (av.length > 0) {
                const [r, c] = av[Math.floor(Math.random() * av.length)];
                const t = get(r,c);
                t.textContent = '⭕';
                t.style.color = '#ff4757';
                if (win('⭕')) end("Defeat.");
            } else {
                end("Draw.");
            }
        }

        rB.onclick = init;
        init();
    </script>
</body>
</html>

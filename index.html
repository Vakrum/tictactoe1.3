<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        * { 
            box-sizing: border-box; 
            box-shadow: none !important;
            text-shadow: none !important;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000000;
            font-family: 'Segoe UI', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        h1 {
            margin-top: -30px;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #ffffff;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(5, 100px);
            grid-template-rows: repeat(5, 100px);
            gap: 10px;
            padding: 10px;
            width: max-content;
        }
        .cell {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            border-radius: 10px;
            color: #ffffff;
        }
        .inner {
            background: #111111;
            border: 1px solid #222222;
        }
        .inner:hover {
            background: #1a1a1a;
        }
        .outer {
            visibility: hidden;
            pointer-events: none;
        }
        .modal {
            display: flex;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #111111;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #333333;
            max-width: 400px;
            width: 90%;
            box-shadow: none !important;
            outline: none;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        button {
            background: #222222;
            color: #ffffff;
            border: 1px solid #444444;
            padding: 12px 30px;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 4px;
            box-shadow: none !important;
            outline: none;
            transition: background 0.2s;
        }
        button:hover {
            background: #333333;
        }
    </style>
</head>
<body>
    <h1>TIC-TAC-TOE</h1>
    <div class="board" id="board"></div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="msg">Choose Difficulty</h2>
            <div class="btn-group">
                <button onclick="startGame('easy')">Easy</button>
                <button onclick="startGame('intermediate')">Intermediate</button>
                <button onclick="startGame('hard')">Hard</button>
            </div>
        </div>
    </div>

    <script>
        const b = document.getElementById('board');
        const m = document.getElementById('modal');
        const t = document.getElementById('msg');
        const S = 5;
        const W = 3;
        let cells = [];
        let active = false;
        let difficulty = 'hard';
        const lines = [];

        for (let r = 0; r < S; r++) {
            for (let c = 0; c < S; c++) {
                if (c <= S - W) lines.push(Array.from({length: W}, (_, i) => [r, c + i]));
                if (r <= S - W) lines.push(Array.from({length: W}, (_, i) => [r + i, c]));
                if (r <= S - W && c <= S - W) lines.push(Array.from({length: W}, (_, i) => [r + i, c + i]));
                if (r <= S - W && c >= W - 1) lines.push(Array.from({length: W}, (_, i) => [r + i, c - i]));
            }
        }

        function startGame(diff) {
            difficulty = diff;
            init();
        }

        function init() {
            b.innerHTML = '';
            cells = [];
            active = true;
            m.style.display = 'none';
            for (let i = 0; i < S * S; i++) {
                const r = Math.floor(i / S);
                const c = i % S;
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (r >= 1 && r <= 3 && c >= 1 && c <= 3) {
                    cell.classList.add('inner');
                } else {
                    cell.classList.add('outer');
                }
                cell.onclick = () => {
                    if (!active || cell.textContent || cell.classList.contains('outer')) return;
                    cell.textContent = 'X';
                    cell.style.color = '#00d2d3';
                    if (checkWin('X')) return end("well u won, ig u cheated or smth what a pure shame");
                    setTimeout(bot, 200);
                };
                b.appendChild(cell);
                cells.push(cell);
            }
        }

        function get(r, c) { return cells[r * S + c]; }
        function checkWin(p) { return lines.some(l => l.every(([r, c]) => get(r,c).textContent === p)); }
        
        function end(s) {
            active = false;
            setTimeout(() => { 
                t.textContent = s; 
                m.style.display = 'flex'; 
            }, 1500);
        }

        function bot() {
            if (!active) return;
            const isInner = (r, c) => r >= 1 && r <= 3 && c >= 1 && c <= 3;

            const getAvailInner = () => {
                const avail = [];
                for (let r = 1; r <= 3; r++) {
                    for (let c = 1; c <= 3; c++) {
                        if (!get(r, c).textContent) avail.push([r, c]);
                    }
                }
                return avail;
            };

            const placeO = (r, c) => {
                const cEl = get(r, c);
                if (!isInner(r, c)) {
                    cEl.style.visibility = 'visible';
                    cEl.style.background = '#111111';
                    cEl.style.border = '1px solid #222222';
                }
                cEl.textContent = 'O';
                cEl.style.color = '#ff4757';
            };

            if (difficulty !== 'easy') {
                for (let l of lines) {
                    const v = l.map(([r, c]) => get(r, c).textContent);
                    if (v.filter(x => x === 'O').length === W - 1 && v.includes('')) {
                        const [r, c] = l[v.indexOf('')];
                        placeO(r, c);
                        return end("LOL u lost to a bot?? such a skill issue");
                    }
                }
            }

            if (difficulty === 'easy') {
                const avail = getAvailInner();
                if (avail.length > 0) {
                    const [r, c] = avail[Math.floor(Math.random() * avail.length)];
                    placeO(r, c);
                } else {
                    end("It's a draw... for now.");
                }
                return;
            }

            if (difficulty === 'intermediate') {
                const shouldBeRandom = Math.random() < 0.5;
                if (shouldBeRandom) {
                    const avail = getAvailInner();
                    if (avail.length > 0) {
                        const [r, c] = avail[Math.floor(Math.random() * avail.length)];
                        placeO(r, c);
                        return;
                    }
                }
            }

            for (let l of lines) {
                const v = l.map(([r, c]) => get(r, c).textContent);
                const allInner = l.every(([r, c]) => isInner(r, c));
                if (allInner && v.filter(x => x === 'X').length === W - 1 && v.includes('')) {
                    const [r, c] = l[v.indexOf('')];
                    placeO(r, c);
                    return;
                }
            }

            const center = get(2, 2);
            if (!center.textContent) {
                placeO(2, 2);
                return;
            }

            const innerCorners = [[1, 1], [1, 3], [3, 1], [3, 3]];
            const availCorners = innerCorners.filter(([r, c]) => !get(r, c).textContent);
            if (availCorners.length > 0) {
                const [r, c] = availCorners[Math.floor(Math.random() * availCorners.length)];
                placeO(r, c);
                return;
            }
            
            const avail = getAvailInner();
            if (avail.length > 0) {
                const [r, c] = avail[Math.floor(Math.random() * avail.length)];
                placeO(r, c);
            } else {
                end("It's a draw... for now.");
            }
        }
    </script>
</body>
</html>
